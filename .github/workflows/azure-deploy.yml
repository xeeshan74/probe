name: Deploy PROBE to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid 409 Conflict when two deploys hit Azure at once (e.g. merge + manual run).
concurrency:
  group: azure-probe-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deploy package
        run: |
          zip -r deploy.zip \
            app.py requirements.txt assessment_controller.py authorization.py \
            chart_help.py finding_help.py charts.py config.py discovery.py dns_utils.py \
            email_checks.py models.py page_classifier.py report_generator.py risk_engine.py \
            storage.py tls_checks.py web_checks.py __init__.py utils .streamlit \
            -x "*.pyc" -x "*__pycache__*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: probe-capstone295
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
